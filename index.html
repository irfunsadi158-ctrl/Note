<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Notes | HSC 26 Note Vault</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #020617; color: #cbd5e1; overflow-x: hidden; }
        .font-en { font-family: 'Inter', sans-serif; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        .view-section { display: none; opacity: 0; transform: translateY(20px); transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .view-section.active { display: block; opacity: 1; transform: translateY(0); }

        .glass-card { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1); }
        .subject-card:hover { transform: translateY(-5px); box-shadow: 0 10px 40px -10px var(--hover-color); border-color: var(--hover-color); }
        
        .chapter-card { transition: all 0.3s ease; border-left: 4px solid transparent; }
        .chapter-card:hover { border-left-color: #6366f1; background: rgba(99, 102, 241, 0.05); transform: translateX(5px); }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-up { animation: fadeUp 0.6s ease-out forwards; }
        
        /* Modal Animation */
        .modal-enter { animation: zoomIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-indigo-500/30">

    <!-- Header -->
    <header class="sticky top-0 z-50 glass-card border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-gradient-to-tr from-indigo-600 to-violet-600 p-2.5 rounded-xl shadow-lg">
                    <i class="fa-solid fa-book-medical text-xl text-white"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">Nexus Notes</h1>
                    <p class="text-[11px] text-slate-400 font-medium tracking-wider uppercase">DMC Aspirant | HSC '26</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <div class="hidden md:flex items-center gap-2 bg-slate-900 px-4 py-2 rounded-full border border-slate-800">
                    <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
                    <span class="text-xs font-semibold text-slate-300">Irfun Sadi</span>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full">
        <!-- Breadcrumb -->
        <nav class="mb-8 flex items-center text-sm font-medium text-slate-400 bg-slate-900/50 p-4 rounded-2xl border border-slate-800 w-fit backdrop-blur-sm">
            <button onclick="navigate('subjects')" class="hover:text-indigo-400 transition flex items-center gap-2"><i class="fa-solid fa-house"></i> হোম</button>
            <div id="breadcrumb-subject" class="hidden items-center gap-2"><i class="fa-solid fa-chevron-right text-[10px] mx-2 text-slate-600"></i><span id="bc-subject-name" class="text-indigo-400"></span></div>
            <div id="breadcrumb-paper" class="hidden items-center gap-2"><i class="fa-solid fa-chevron-right text-[10px] mx-2 text-slate-600"></i><span id="bc-paper-name" class="text-cyan-400"></span></div>
        </nav>

        <!-- Views -->
        <div id="view-subjects" class="view-section active">
            <div class="mb-6">
                <h2 class="text-2xl font-bold text-white mb-1">তোমার বিষয়সমূহ</h2>
                <p class="text-sm text-slate-400">যে বিষয়ের নোট পড়তে চাও, সেটি নির্বাচন করো।</p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="subjects-container"></div>
        </div>

        <div id="view-papers" class="view-section">
            <div class="mb-6 flex items-center justify-between">
                <div>
                    <h2 class="text-2xl font-bold text-white mb-1" id="paper-view-title">পত্র নির্বাচন</h2>
                    <p class="text-sm text-slate-400">প্রথম নাকি দ্বিতীয় পত্র?</p>
                </div>
                <button onclick="navigate('subjects')" class="w-10 h-10 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition flex items-center justify-center border border-slate-700"><i class="fa-solid fa-arrow-left"></i></button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-4xl" id="papers-container"></div>
        </div>

        <div id="view-chapters" class="view-section">
            <div class="mb-6 flex items-center justify-between">
                <div>
                    <h2 class="text-2xl font-bold text-white mb-1" id="chapter-view-title">অধ্যায়সমূহ</h2>
                    <p class="text-sm text-slate-400">যে কোনো অধ্যায়ে ক্লিক করে নোটের লিংক অ্যাড করো বা পড়ো।</p>
                </div>
                <button id="back-to-papers-btn" class="w-10 h-10 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition flex items-center justify-center border border-slate-700"><i class="fa-solid fa-arrow-left"></i></button>
            </div>
            <div class="glass-card rounded-2xl p-4 md:p-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="chapters-container"></div>
            </div>
        </div>
    </main>

    <!-- Note Upload/Edit Modal -->
    <div id="note-modal" class="hidden fixed inset-0 z-[100] bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 w-full max-w-md rounded-2xl shadow-2xl modal-enter overflow-hidden">
            <div class="p-5 border-b border-slate-800 flex justify-between items-center bg-slate-800/50">
                <h3 class="font-bold text-white flex items-center gap-2"><i class="fa-solid fa-link text-indigo-400"></i> <span id="modal-title">নোট লিংক সেটআপ</span></h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-rose-400 transition"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-6">
                <p id="modal-chapter-name" class="text-sm text-slate-300 mb-4 font-semibold"></p>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-2 uppercase tracking-wide">গুগল ড্রাইভ বা পিডিএফ লিংক:</label>
                        <input type="url" id="note-link-input" placeholder="https://drive.google.com/..." class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
                    </div>
                    
                    <div id="modal-actions-empty" class="pt-2">
                        <button onclick="saveNoteLink()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-cloud-arrow-up"></i> সেভ করুন
                        </button>
                    </div>
                    
                    <div id="modal-actions-saved" class="hidden grid grid-cols-2 gap-3 pt-2">
                        <button onclick="openSavedNote()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-book-open"></i> নোট পড়ো
                        </button>
                        <button onclick="saveNoteLink()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-pen"></i> আপডেট
                        </button>
                        <button onclick="deleteNoteLink()" class="col-span-2 bg-rose-950/50 hover:bg-rose-900 border border-rose-900/50 text-rose-400 font-bold py-2.5 rounded-xl transition flex items-center justify-center gap-2 mt-1">
                            <i class="fa-solid fa-trash-can"></i> লিংক ডিলিট করুন
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script for Dynamic Logic -->
    <script>
        // Database
        const database = {
            physics: { id: 'physics', name: 'পদার্থবিজ্ঞান', icon: 'fa-atom', color: 'from-blue-500 to-cyan-500', shadowColor: 'rgba(59, 130, 246, 0.4)', papers: [
                { id: 'p1', name: 'প্রথম পত্র', icon: 'fa-rocket', chapters: ['ভৌত জগৎ ও পরিমাপ', 'ভেক্টর', 'গতিবিদ্যা', 'নিউটনিয়ান বলবিদ্যা', 'কাজ, ক্ষমতা ও শক্তি', 'মহাকর্ষ ও অভিকর্ষ', 'পদার্থের গাঠনিক ধর্ম', 'পর্যাবৃত্ত গতি', 'তরঙ্গ', 'আদর্শ গ্যাস ও গ্যাসের গতিতত্ত্ব'] },
                { id: 'p2', name: 'দ্বিতীয় পত্র', icon: 'fa-magnet', chapters: ['তাপগতিবিদ্যা', 'স্থির তড়িৎ', 'চল তড়িৎ', 'তড়িৎ প্রবাহের চৌম্বক ক্রিয়া ও চুম্বকত্ব', 'তাড়িতচৌম্বক আবেশ ও পরিবর্তী প্রবাহ', 'জ্যামিতিক আলোকবিজ্ঞান', 'ভৌত আলোকবিজ্ঞান', 'আধুনিক পদার্থবিজ্ঞানের সূচনা', 'পরমাণুর মডেল ও নিউক্লিয়ার পদার্থবিজ্ঞান', 'সেমিকন্ডাক্টর ও ইলেকট্রনিক্স', 'জ্যোতির্বিজ্ঞান'] }
            ]},
            biology: { id: 'biology', name: 'জীববিজ্ঞান', icon: 'fa-dna', color: 'from-emerald-500 to-teal-500', shadowColor: 'rgba(16, 185, 129, 0.4)', papers: [
                { id: 'p1', name: 'প্রথম পত্র (উদ্ভিদবিজ্ঞান)', icon: 'fa-leaf', chapters: ['কোষ ও এর গঠন', 'কোষ বিভাজন', 'কোষ রসায়ন', 'অণুজীব', 'শৈবাল ও ছত্রাক', 'ব্রায়োফাইটা ও টেরিডোফাইটা', 'নগ্নবীজী ও আবৃতবীজী উদ্ভিদ', 'টিস্যু ও টিস্যুতন্ত্র', 'উদ্ভিদ শারীরতত্ত্ব', 'উদ্ভিদ প্রজনন', 'জীবপ্রযুক্তি', 'জীবের পরিবেশ, বিস্তার ও সংরক্ষণ'] },
                { id: 'p2', name: 'দ্বিতীয় পত্র (প্রাণিবিজ্ঞান)', icon: 'fa-frog', chapters: ['প্রাণীর বিভিন্নতা ও শ্রেণিবিন্যাস', 'প্রাণীর পরিচিতি', 'মানব শারীরতত্ত্ব: পরিপাক ও শোষণ', 'মানব শারীরতত্ত্ব: রক্ত ও সঞ্চালন', 'মানব শারীরতত্ত্ব: শ্বসন ও শ্বাসক্রিয়া', 'মানব শারীরতত্ত্ব: বর্জ্য ও নিষ্কাশন', 'মানব শারীরতত্ত্ব: চলন ও অঙ্গচালনা', 'মানব শারীরতত্ত্ব: সমন্বয় ও নিয়ন্ত্রণ', 'মানবজীবনের ধারাবাহিকতা', 'মানবদেহের প্রতিরক্ষা', 'জিনতত্ত্ব ও বিবর্তন', 'প্রাণীর আচরণ'] }
            ]},
            math: { id: 'math', name: 'উচ্চতর গণিত', icon: 'fa-calculator', color: 'from-rose-500 to-orange-500', shadowColor: 'rgba(244, 63, 94, 0.4)', papers: [
                { id: 'p1', name: 'প্রথম পত্র', icon: 'fa-shapes', chapters: ['ম্যাট্রিক্স ও নির্ণায়ক', 'ভেক্টর', 'সরলরেখা', 'বৃত্ত', 'বিন্যাস ও সমাবেশ', 'ত্রিকোণমিতিক অনুপাত', 'সংযুক্ত কোণের ত্রিকোণমিতিক অনুপাত', 'ফাংশন ও ফাংশনের লেখচিত্র', 'অন্তরীকরণ', 'যোগজীকরণ'] },
                { id: 'p2', name: 'দ্বিতীয় পত্র', icon: 'fa-chart-line', chapters: ['বাস্তব সংখ্যা ও অসমতা', 'যোগাশ্রয়ী প্রোগ্রাম', 'জটিল সংখ্যা', 'বহুপদী ও বহুপদী সমীকরণ', 'দ্বিপদী বিস্তৃতি', 'কণিক', 'বিপরীত ত্রিকোণমিতিক ফাংশন ও ত্রিকোণমিতিক সমীকরণ', 'স্থিতিবিদ্যা', 'সমতলে বস্তুকণার গতি', 'বিস্তার পরিমাপ ও সম্ভাবনা'] }
            ]},
            chemistry: { id: 'chemistry', name: 'রসায়ন', icon: 'fa-flask', color: 'from-violet-500 to-purple-500', shadowColor: 'rgba(139, 92, 246, 0.4)', papers: [
                { id: 'p1', name: 'প্রথম পত্র', icon: 'fa-vial', chapters: ['ল্যাবরেটরির নিরাপদ ব্যবহার', 'গুণগত রসায়ন', 'মৌলের পর্যায়বৃত্ত ধর্ম ও রাসায়নিক বন্ধন', 'রাসায়নিক পরিবর্তন', 'কর্মমুখী রসায়ন'] },
                { id: 'p2', name: 'দ্বিতীয় পত্র', icon: 'fa-vials', chapters: ['পরিবেশ রসায়ন', 'জৈব রসায়ন', 'পরিমাণগত রসায়ন', 'তড়িৎ রসায়ন', 'অর্থনৈতিক রসায়ন'] }
            ]},
            english: { id: 'english', name: 'English', icon: 'fa-language', color: 'from-pink-500 to-rose-500', shadowColor: 'rgba(236, 72, 153, 0.4)', papers: [
                { id: 'p1', name: 'English 1st Paper', icon: 'fa-book-open', chapters: ['Comprehension', 'Vocabulary', 'Flowchart', 'Summary Writing', 'Rearrange'] },
                { id: 'p2', name: 'English 2nd Paper', icon: 'fa-pen-nib', chapters: ['Prepositions', 'Special Uses of Phrases', 'Completing Sentences', 'Right Form of Verbs', 'Narration', 'Modifiers', 'Connectors', 'Synonym & Antonym', 'Punctuation'] }
            ]},
            gk: { id: 'gk', name: 'সাধারণ জ্ঞান', icon: 'fa-globe', color: 'from-amber-500 to-yellow-500', shadowColor: 'rgba(245, 158, 11, 0.4)', papers: [
                { id: 'p1', name: 'বাংলাদেশ ও আন্তর্জাতিক বিষয়াবলি', icon: 'fa-map', chapters: ['বাংলাদেশের ইতিহাস', 'মুক্তিযুদ্ধ', 'বাংলাদেশের ভৌগোলিক অবস্থান', 'আন্তর্জাতিক সংস্থা', 'সাম্প্রতিক বিষয়াবলি'] }
            ]}
        };

        let currentSubject = null;
        let currentPaper = null;
        let activeChapterKey = null; // To track which chapter is selected for modal
        let savedNotesData = JSON.parse(localStorage.getItem('nexus_notes_data')) || {};

        document.addEventListener('DOMContentLoaded', () => { renderSubjects(); });

        function renderSubjects() {
            const container = document.getElementById('subjects-container');
            container.innerHTML = '';
            let delay = 0;
            for (const key in database) {
                const sub = database[key];
                const card = document.createElement('div');
                card.style.setProperty('--hover-color', sub.shadowColor);
                card.className = `subject-card glass-card rounded-2xl p-6 cursor-pointer group animate-fade-up`;
                card.style.animationDelay = `${delay}s`;
                card.innerHTML = `
                    <div class="flex flex-col h-full justify-between gap-6">
                        <div class="flex justify-between items-start">
                            <div class="w-14 h-14 rounded-2xl bg-slate-800 flex items-center justify-center border border-slate-700 group-hover:border-slate-500 transition-colors">
                                <i class="fa-solid ${sub.icon} text-2xl bg-gradient-to-br ${sub.color} bg-clip-text text-transparent"></i>
                            </div>
                            <div class="bg-slate-800/80 px-3 py-1 rounded-full border border-slate-700 text-[11px] text-slate-400">${sub.papers.length} Papers</div>
                        </div>
                        <div>
                            <h3 class="text-xl font-bold text-slate-200 group-hover:text-white transition-colors">${sub.name}</h3>
                            <p class="text-sm text-slate-500 mt-1 flex items-center gap-2 group-hover:text-slate-400 transition-colors">চ্যাপ্টার দেখতে ক্লিক করো <i class="fa-solid fa-arrow-right-long text-xs opacity-0 group-hover:opacity-100 transform -translate-x-2 group-hover:translate-x-0 transition-all"></i></p>
                        </div>
                    </div>
                `;
                card.onclick = () => openSubject(key);
                container.appendChild(card);
                delay += 0.05;
            }
        }

        function openSubject(subjectId) {
            currentSubject = database[subjectId];
            const container = document.getElementById('papers-container');
            container.innerHTML = '';
            document.getElementById('paper-view-title').innerText = currentSubject.name;
            let delay = 0;
            currentSubject.papers.forEach((paper, index) => {
                const card = document.createElement('div');
                card.className = `glass-card rounded-2xl p-6 cursor-pointer hover:bg-slate-800/50 transition-all border border-slate-800 hover:border-slate-600 group animate-fade-up relative overflow-hidden`;
                card.style.animationDelay = `${delay}s`;
                card.innerHTML = `
                    <div class="absolute top-0 right-0 w-32 h-32 bg-gradient-to-br ${currentSubject.color} opacity-[0.03] rounded-bl-full group-hover:opacity-10 transition-opacity"></div>
                    <div class="flex items-center gap-5 relative z-10">
                        <div class="w-12 h-12 rounded-xl bg-slate-900 flex items-center justify-center border border-slate-700">
                            <i class="fa-solid ${paper.icon} text-xl text-slate-300"></i>
                        </div>
                        <div>
                            <h3 class="text-lg font-bold text-slate-200 group-hover:text-white transition-colors">${paper.name}</h3>
                            <p class="text-sm text-slate-500">${paper.chapters.length} টি অধ্যায়</p>
                        </div>
                    </div>
                `;
                card.onclick = () => openPaper(index);
                container.appendChild(card);
                delay += 0.1;
            });
            updateBreadcrumb('papers');
            navigate('papers');
        }

        function openPaper(paperIndex) {
            currentPaper = currentSubject.papers[paperIndex];
            renderChaptersUI();
            document.getElementById('chapter-view-title').innerText = `${currentSubject.name} - ${currentPaper.name}`;
            document.getElementById('back-to-papers-btn').onclick = () => navigate('papers');
            updateBreadcrumb('chapters');
            navigate('chapters');
        }

        // Separate function to render chapters so we can re-render after saving a note
        function renderChaptersUI() {
            const container = document.getElementById('chapters-container');
            container.innerHTML = '';
            let delay = 0;
            
            currentPaper.chapters.forEach((chapterName, i) => {
                const chapterKey = `${currentSubject.id}_${currentPaper.id}_${i}`;
                const hasNote = savedNotesData[chapterKey] ? true : false;
                
                const card = document.createElement('div');
                card.className = `chapter-card bg-slate-900/50 border ${hasNote ? 'border-emerald-500/30' : 'border-slate-800'} p-4 rounded-xl cursor-pointer flex items-center justify-between group animate-fade-up`;
                card.style.animationDelay = `${delay}s`;
                
                const bdNum = (i + 1).toLocaleString('bn-BD');
                
                // If it has a note, show a green icon and text
                let iconHtml = hasNote 
                    ? `<span class="bg-emerald-500/10 text-emerald-400 text-[10px] px-2 py-1 rounded border border-emerald-500/20 font-bold tracking-wider uppercase"><i class="fa-solid fa-check-circle"></i> Saved</span>`
                    : `<i class="fa-solid fa-link text-slate-600 group-hover:text-indigo-400 transition-colors"></i>`;

                card.innerHTML = `
                    <div class="flex items-center gap-4">
                        <span class="w-8 h-8 rounded-lg bg-slate-800 ${hasNote ? 'text-emerald-400' : 'text-slate-400'} flex items-center justify-center text-xs font-bold border border-slate-700 group-hover:bg-indigo-500/20 group-hover:text-indigo-400 group-hover:border-indigo-500/30 transition-colors">
                            ${currentSubject.id === 'english' ? (i+1) : bdNum}
                        </span>
                        <h4 class="text-sm font-semibold text-slate-300 group-hover:text-white transition-colors line-clamp-1">${chapterName}</h4>
                    </div>
                    ${iconHtml}
                `;
                
                card.onclick = () => openModal(chapterKey, chapterName);
                container.appendChild(card);
                delay += 0.03;
            });
        }

        // Modal Logic
        const modal = document.getElementById('note-modal');
        const linkInput = document.getElementById('note-link-input');
        const emptyActions = document.getElementById('modal-actions-empty');
        const savedActions = document.getElementById('modal-actions-saved');

        function openModal(key, name) {
            activeChapterKey = key;
            document.getElementById('modal-chapter-name').innerText = `অধ্যায়: ${name}`;
            
            if (savedNotesData[key]) {
                linkInput.value = savedNotesData[key];
                emptyActions.classList.add('hidden');
                savedActions.classList.remove('hidden');
            } else {
                linkInput.value = '';
                emptyActions.classList.remove('hidden');
                savedActions.classList.add('hidden');
            }
            modal.classList.remove('hidden');
        }

        function closeModal() {
            modal.classList.add('hidden');
            activeChapterKey = null;
        }

        function saveNoteLink() {
            const url = linkInput.value.trim();
            if (!url) {
                alert('অনুগ্রহ করে একটি সঠিক লিংক দিন!');
                return;
            }
            
            // Save to LocalStorage
            savedNotesData[activeChapterKey] = url;
            localStorage.setItem('nexus_notes_data', JSON.stringify(savedNotesData));
            
            // Refresh UI
            closeModal();
            renderChaptersUI(); 
        }

        function openSavedNote() {
            if (savedNotesData[activeChapterKey]) {
                window.open(savedNotesData[activeChapterKey], '_blank');
            }
        }

        function deleteNoteLink() {
            if (confirm('তুমি কি নিশ্চিত যে এই নোটের লিংকটি মুছে ফেলতে চাও?')) {
                delete savedNotesData[activeChapterKey];
                localStorage.setItem('nexus_notes_data', JSON.stringify(savedNotesData));
                closeModal();
                renderChaptersUI();
            }
        }

        // Navigation Controller
        function navigate(viewName) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            setTimeout(() => document.getElementById(`view-${viewName}`).classList.add('active'), 50);
            if (viewName === 'subjects') {
                document.getElementById('breadcrumb-subject').classList.add('hidden');
                document.getElementById('breadcrumb-paper').classList.add('hidden');
                currentSubject = null; currentPaper = null;
            }
        }

        function updateBreadcrumb(level) {
            const bcSub = document.getElementById('breadcrumb-subject');
            const bcPap = document.getElementById('breadcrumb-paper');
            if (level === 'papers') {
                bcSub.classList.remove('hidden'); bcPap.classList.add('hidden');
                document.getElementById('bc-subject-name').innerText = currentSubject.name;
                bcSub.onclick = () => navigate('papers');
                bcSub.classList.add('cursor-pointer', 'hover:text-indigo-300');
            } 
            else if (level === 'chapters') {
                bcPap.classList.remove('hidden');
                document.getElementById('bc-paper-name').innerText = currentPaper.name;
                bcSub.classList.add('cursor-pointer', 'hover:text-indigo-300');
            }
        }
    </script>
</body>
</html>
