<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Notes | HSC 26 Note Vault</title>
    
    <!-- Tailwind CSS with Custom Config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Hind Siliguri', 'sans-serif'], en: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { transition: background-color 0.3s ease, color 0.3s ease; overflow-x: hidden; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #334155; }
        
        .view-section { display: none; opacity: 0; transform: translateY(20px); transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .view-section.active { display: block; opacity: 1; transform: translateY(0); }

        /* Glassmorphism Dynamic */
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
        }
        .dark .glass-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
        }

        .subject-card:hover { transform: translateY(-5px); box-shadow: 0 10px 40px -10px var(--hover-color); border-color: var(--hover-color); }
        
        .chapter-card { transition: all 0.3s ease; border-left: 4px solid transparent; }
        .chapter-card:hover { border-left-color: #6366f1; transform: translateX(5px); }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-up { animation: fadeUp 0.6s ease-out forwards; }
        .modal-enter { animation: zoomIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased bg-slate-50 text-slate-800 dark:bg-[#020617] dark:text-slate-300 selection:bg-indigo-500/30">

    <!-- Header -->

        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-gradient-to-tr from-indigo-600 to-violet-600 p-2.5 rounded-xl shadow-lg">
                    <i class="fa-solid fa-book-medical text-xl text-white"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide bg-gradient-to-r from-indigo-600 to-cyan-600 dark:from-indigo-400 dark:to-cyan-400 bg-clip-text text-transparent">Nexus Notes</h1>
                    <p class="text-[11px] text-slate-500 dark:text-slate-400 font-medium tracking-wider uppercase">DMC Aspirant | HSC '26</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <!-- Theme Toggle Button -->
                <button id="theme-toggle" class="w-10 h-10 rounded-full bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-amber-400 flex items-center justify-center transition-colors shadow-sm border border-slate-300 dark:border-slate-700">
                    <i id="theme-icon" class="fa-solid fa-moon"></i>
                </button>
                <div class="hidden md:flex items-center gap-2 bg-white dark:bg-slate-900 px-4 py-2 rounded-full border border-slate-200 dark:border-slate-800 shadow-sm">
                    <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
                    <span class="text-xs font-semibold text-slate-700 dark:text-slate-300">Irfun Sadi</span>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full">
        <!-- Breadcrumb -->
        <nav class="mb-8 flex items-center text-sm font-medium text-slate-600 dark:text-slate-400 bg-white/50 dark:bg-slate-900/50 p-3.5 rounded-2xl border border-slate-200 dark:border-slate-800 w-fit backdrop-blur-sm shadow-sm">
            <button onclick="navigate('subjects')" class="hover:text-indigo-600 dark:hover:text-indigo-400 transition flex items-center gap-2"><i class="fa-solid fa-house"></i> হোম</button>
            <div id="breadcrumb-subject" class="hidden items-center gap-2"><i class="fa-solid fa-chevron-right text-[10px] mx-2 text-slate-400 dark:text-slate-600"></i><span id="bc-subject-name" class="text-indigo-600 dark:text-indigo-400"></span></div>
            <div id="breadcrumb-paper" class="hidden items-center gap-2"><i class="fa-solid fa-chevron-right text-[10px] mx-2 text-slate-400 dark:text-slate-600"></i><span id="bc-paper-name" class="text-cyan-600 dark:text-cyan-400"></span></div>
        </nav>

        <!-- Views -->
        <div id="view-subjects" class="view-section active">
            <div class="mb-6">
                <h2 class="text-2xl font-bold text-slate-900 dark:text-white mb-1">তোমার বিষয়সমূহ</h2>
                <p class="text-sm text-slate-500 dark:text-slate-400">যে বিষয়ের নোট পড়তে চাও, সেটি নির্বাচন করো।</p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="subjects-container"></div>
        </div>

        <div id="view-papers" class="view-section">
            <div class="mb-6 flex items-center justify-between">
                <div>
                    <h2 class="text-2xl font-bold text-slate-900 dark:text-white mb-1" id="paper-view-title">পত্র নির্বাচন</h2>
                    <p class="text-sm text-slate-500 dark:text-slate-400">প্রথম নাকি দ্বিতীয় পত্র?</p>
                </div>
                <button onclick="navigate('subjects')" class="w-10 h-10 rounded-xl bg-slate-200 hover:bg-slate-300 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 transition flex items-center justify-center border border-slate-300 dark:border-slate-700"><i class="fa-solid fa-arrow-left"></i></button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-4xl" id="papers-container"></div>
        </div>

        <div id="view-chapters" class="view-section">
            <div class="mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                    <h2 class="text-2xl font-bold text-slate-900 dark:text-white mb-1" id="chapter-view-title">অধ্যায়সমূহ</h2>
                    <p class="text-sm text-slate-500 dark:text-slate-400">যে কোনো অধ্যায়ে ক্লিক করে নোটের লিংক অ্যাড করো বা পড়ো।</p>
                </div>
                <div class="flex items-center gap-3 w-full md:w-auto">
                    <!-- Smart Search Feature -->
                    <div class="relative w-full md:w-64">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                        <input type="text" id="chapter-search" placeholder="অধ্যায় খুঁজুন..." oninput="filterChapters()" class="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl pl-9 pr-3 py-2.5 text-sm text-slate-800 dark:text-white focus:outline-none focus:border-indigo-500 transition shadow-sm">
                    </div>
                    <button id="back-to-papers-btn" class="w-10 h-10 flex-shrink-0 rounded-xl bg-slate-200 hover:bg-slate-300 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 transition flex items-center justify-center border border-slate-300 dark:border-slate-700"><i class="fa-solid fa-arrow-left"></i></button>
                </div>
            </div>
            <div class="glass-card rounded-2xl p-4 md:p-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="chapters-container"></div>
                <div id="no-result-msg" class="hidden text-center py-8 text-slate-500 dark:text-slate-400 text-sm font-semibold">কোনো অধ্যায় পাওয়া যায়নি!</div>
            </div>
        </div>
    </main>

    <!-- Multiple Note Upload Modal -->
    <div id="note-modal" class="hidden fixed inset-0 z-[100] bg-slate-900/60 dark:bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 w-full max-w-md rounded-2xl shadow-2xl modal-enter overflow-hidden flex flex-col max-h-[90vh]">
            <div class="p-5 border-b border-slate-200 dark:border-slate-800 flex justify-between items-center bg-slate-50 dark:bg-slate-800/50">
                <h3 class="font-bold text-slate-900 dark:text-white flex items-center gap-2"><i class="fa-solid fa-folder-open text-indigo-500 dark:text-indigo-400"></i> <span id="modal-title">চ্যাপ্টার নোটস</span></h3>
                <button onclick="closeModal()" class="text-slate-500 hover:text-rose-500 dark:text-slate-400 dark:hover:text-rose-400 transition"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-5 overflow-y-auto flex-grow">
                <p id="modal-chapter-name" class="text-sm text-slate-700 dark:text-slate-300 mb-4 font-semibold pb-2 border-b border-slate-200 dark:border-slate-700/50"></p>
                
                <!-- Saved Notes List -->
                <div id="saved-notes-list" class="space-y-3 mb-6">
                    <!-- Note items will be injected here -->
                </div>

                <!-- Add New Note Section -->
                <div class="bg-slate-100 dark:bg-slate-800/30 p-4 rounded-xl border border-slate-200 dark:border-slate-700/50 space-y-3">
                    <h4 class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wide"><i class="fa-solid fa-plus-circle"></i> নতুন নোট যুক্ত করুন</h4>
                    <div>
                        <input type="text" id="note-title-input" placeholder="নোটের নাম (যেমন: লেকচার শিট, মেইন বই)" class="w-full bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 text-sm text-slate-800 dark:text-white focus:outline-none focus:border-indigo-500 transition mb-2 shadow-sm">
                        <input type="url" id="note-link-input" placeholder="লিংক (https://drive.google.com/...)" class="w-full bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 text-sm text-slate-800 dark:text-white focus:outline-none focus:border-indigo-500 transition shadow-sm">
                    </div>
                    <button onclick="addNewNote()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-lg transition flex items-center justify-center gap-2 shadow-sm">
                        <i class="fa-solid fa-cloud-arrow-up"></i> লিংক সেভ করুন
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Theme Management Logic
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const htmlEl = document.documentElement;

        // Initialize Theme from Local Storage or default to Dark
        if (localStorage.getItem('theme') === 'light') {
            htmlEl.classList.remove('dark');
            themeIcon.className = "fa-solid fa-sun text-amber-500";
        }

        themeToggleBtn.addEventListener('click', () => {
            if (htmlEl.classList.contains('dark')) {
                htmlEl.classList.remove('dark');
                localStorage.setItem('theme', 'light');
                themeIcon.className = "fa-solid fa-sun text-amber-500";
            } else {
                htmlEl.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                themeIcon.className = "fa-solid fa-moon";
            }
        });

        // Database

            ]},
            chemistry: { id: 'chemistry', name: 'রসায়ন', icon: 'fa-flask', color: 'from-violet-500 to-purple-500', shadowColor: 'rgba(139, 92, 246, 0.4)', papers: [
                { id: 'p1', name: 'প্রথম পত্র', icon: 'fa-vial', chapters: ['ল্যাবরেটরির নিরাপদ ব্যবহার', 'গুণগত রসায়ন', 'মৌলের পর্যায়বৃত্ত ধর্ম ও রাসায়নিক বন্ধন', 'রাসায়নিক পরিবর্তন', 'কর্মমুখী রসায়ন'] },
                { id: 'p2', name: 'দ্বিতীয় পত্র', icon: 'fa-vials', chapters: ['পরিবেশ রসায়ন', 'জৈব রসায়ন', 'পরিমাণগত রসায়ন', 'তড়িৎ রসায়ন', 'অর্থনৈতিক রসায়ন'] }

        let currentPaper = null;
        let activeChapterKey = null; 
        
        // Data Structure Migration and Fetch
        let savedNotesData = JSON.parse(localStorage.getItem('nexus_notes_data_v2')) || {};
        
        // Migration from old string format to new array format if user had old data
        const oldData = JSON.parse(localStorage.getItem('nexus_notes_data'));
        if (oldData && Object.keys(savedNotesData).length === 0) {
            for (const key in oldData) {
                if (typeof oldData[key] === 'string') {
                    savedNotesData[key] = [{ title: 'Main Note', url: oldData[key], id: Date.now().toString() }];
                }
            }
            localStorage.setItem('nexus_notes_data_v2', JSON.stringify(savedNotesData));
        }

        document.addEventListener('DOMContentLoaded', () => { renderSubjects(); });

        function renderSubjects() {
            const container = document.getElementById('subjects-container');
            container.innerHTML = '';
            let delay = 0;
            for (const key in database) {
                const sub = database[key];
                const card = document.createElement('div');
                card.style.setProperty('--hover-color', sub.shadowColor);
                card.className = `subject-card glass-card rounded-2xl p-6 cursor-pointer group animate-fade-up`;
                card.style.animationDelay = `${delay}s`;
                card.innerHTML = `
                    <div class="flex flex-col h-full justify-between gap-6">
                        <div class="flex justify-between items-start">
                            <div class="w-14 h-14 rounded-2xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center border border-slate-200 dark:border-slate-700 group-hover:border-slate-300 dark:group-hover:border-slate-500 transition-colors shadow-sm">
                                <i class="fa-solid ${sub.icon} text-2xl bg-gradient-to-br ${sub.color} bg-clip-text text-transparent"></i>
                            </div>
                            <div class="bg-white/80 dark:bg-slate-800/80 px-3 py-1 rounded-full border border-slate-200 dark:border-slate-700 text-[11px] text-slate-500 dark:text-slate-400 shadow-sm">${sub.papers.length} Papers</div>
                        </div>
                        <div>
                            <h3 class="text-xl font-bold text-slate-800 dark:text-slate-200 group-hover:text-indigo-600 dark:group-hover:text-white transition-colors">${sub.name}</h3>
                            <p class="text-sm text-slate-500 mt-1 flex items-center gap-2 group-hover:text-indigo-500 dark:group-hover:text-slate-400 transition-colors">চ্যাপ্টার দেখতে ক্লিক করো <i class="fa-solid fa-arrow-right-long text-xs opacity-0 group-hover:opacity-100 transform -translate-x-2 group-hover:translate-x-0 transition-all"></i></p>
                        </div>
                    </div>
                `;
                card.onclick = () => openSubject(key);
                container.appendChild(card);
                delay += 0.05;
            }
        }

        function openSubject(subjectId) {
            currentSubject = database[subjectId];
            const container = document.getElementById('papers-container');
            container.innerHTML = '';
            document.getElementById('paper-view-title').innerText = currentSubject.name;
            let delay = 0;
            currentSubject.papers.forEach((paper, index) => {
                const card = document.createElement('div');
                card.className = `glass-card rounded-2xl p-6 cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-all border border-slate-200 dark:border-slate-800 hover:border-slate-300 dark:hover:border-slate-600 group animate-fade-up relative overflow-hidden`;
                card.style.animationDelay = `${delay}s`;
                card.innerHTML = `
                    <div class="absolute top-0 right-0 w-32 h-32 bg-gradient-to-br ${currentSubject.color} opacity-10 dark:opacity-[0.03] rounded-bl-full group-hover:opacity-20 dark:group-hover:opacity-10 transition-opacity"></div>
                    <div class="flex items-center gap-5 relative z-10">
                        <div class="w-12 h-12 rounded-xl bg-slate-100 dark:bg-slate-900 flex items-center justify-center border border-slate-200 dark:border-slate-700 shadow-sm">
                            <i class="fa-solid ${paper.icon} text-xl text-slate-600 dark:text-slate-300"></i>
                        </div>
                        <div>
                            <h3 class="text-lg font-bold text-slate-800 dark:text-slate-200 group-hover:text-indigo-600 dark:group-hover:text-white transition-colors">${paper.name}</h3>
                            <p class="text-sm text-slate-500">${paper.chapters.length} টি অধ্যায়</p>
                        </div>
                    </div>
                `;
                card.onclick = () => openPaper(index);
                container.appendChild(card);
                delay += 0.1;
            });
            updateBreadcrumb('papers');
            navigate('papers');
        }

        function openPaper(paperIndex) {
            currentPaper = currentSubject.papers[paperIndex];
            document.getElementById('chapter-search').value = ''; // Reset search
            renderChaptersUI();
            document.getElementById('chapter-view-title').innerText = `${currentSubject.name} - ${currentPaper.name}`;
            document.getElementById('back-to-papers-btn').onclick = () => navigate('papers');
            updateBreadcrumb('chapters');
            navigate('chapters');
        }

        function renderChaptersUI(filterText = '') {
            const container = document.getElementById('chapters-container');
            const noResultMsg = document.getElementById('no-result-msg');
            container.innerHTML = '';
            let delay = 0;
            let matchCount = 0;
            
            currentPaper.chapters.forEach((chapterName, i) => {
                // Search filter logic
                if (filterText && !chapterName.toLowerCase().includes(filterText.toLowerCase())) return;
                
                matchCount++;
                const chapterKey = `${currentSubject.id}_${currentPaper.id}_${i}`;
                const chapterNotes = savedNotesData[chapterKey] || [];
                const noteCount = chapterNotes.length;
                
                const card = document.createElement('div');
                card.className = `chapter-card bg-white dark:bg-slate-900/50 border ${noteCount > 0 ? 'border-emerald-500/40 dark:border-emerald-500/30' : 'border-slate-200 dark:border-slate-800'} p-4 rounded-xl cursor-pointer flex items-center justify-between group animate-fade-up shadow-sm`;
                card.style.animationDelay = `${delay}s`;
                
                const bdNum = (i + 1).toLocaleString('bn-BD');
                
                let iconHtml = noteCount > 0 
                    ? `<span class="bg-emerald-100 text-emerald-700 dark:bg-emerald-500/10 dark:text-emerald-400 text-[10px] px-2 py-1 rounded border border-emerald-300 dark:border-emerald-500/20 font-bold tracking-wider">${noteCount} Notes</span>`
                    : `<i class="fa-solid fa-plus text-slate-400 dark:text-slate-600 group-hover:text-indigo-500 dark:group-hover:text-indigo-400 transition-colors"></i>`;

                card.innerHTML = `
                    <div class="flex items-center gap-4">
                        <span class="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-800 ${noteCount > 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-500 dark:text-slate-400'} flex items-center justify-center text-xs font-bold border border-slate-200 dark:border-slate-700 group-hover:bg-indigo-50 dark:group-hover:bg-indigo-500/20 group-hover:text-indigo-600 dark:group-hover:text-indigo-400 group-hover:border-indigo-200 dark:group-hover:border-indigo-500/30 transition-colors">
                            ${currentSubject.id === 'english' ? (i+1) : bdNum}
                        </span>
                        <h4 class="text-sm font-semibold text-slate-700 dark:text-slate-300 group-hover:text-indigo-600 dark:group-hover:text-white transition-colors line-clamp-1">${chapterName}</h4>
                    </div>
                    ${iconHtml}
                `;
                
                card.onclick = () => openModal(chapterKey, chapterName);
                container.appendChild(card);
                delay += 0.02;
            });

            if(matchCount === 0) noResultMsg.classList.remove('hidden');
            else noResultMsg.classList.add('hidden');
        }

        // Search feature trigger
        function filterChapters() {
            const query = document.getElementById('chapter-search').value;
            renderChaptersUI(query);
        }

        // Modal Logic
        const modal = document.getElementById('note-modal');
        const titleInput = document.getElementById('note-title-input');
        const linkInput = document.getElementById('note-link-input');
        const notesListContainer = document.getElementById('saved-notes-list');

        function openModal(key, name) {
            activeChapterKey = key;
            document.getElementById('modal-chapter-name').innerText = `অধ্যায়: ${name}`;
            titleInput.value = '';
            linkInput.value = '';
            renderNotesListInModal();
            modal.classList.remove('hidden');
        }

        function closeModal() {
            modal.classList.add('hidden');
            activeChapterKey = null;
        }

        function renderNotesListInModal() {
            notesListContainer.innerHTML = '';
            const notes = savedNotesData[activeChapterKey] || [];
            
            if (notes.length === 0) {
                notesListContainer.innerHTML = `<div class="text-center py-4 text-xs text-slate-400 dark:text-slate-500 border border-dashed border-slate-300 dark:border-slate-700 rounded-xl">এই চ্যাপ্টারে এখনো কোনো নোট যোগ করা হয়নি।</div>`;
                return;
            }

            notes.forEach(note => {
                const item = document.createElement('div');
                item.className = "flex items-center justify-between p-3 rounded-lg bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 shadow-sm";
                item.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden">
                        <div class="w-8 h-8 rounded bg-indigo-100 dark:bg-indigo-500/20 text-indigo-600 dark:text-indigo-400 flex items-center justify-center flex-shrink-0">
                            <i class="fa-solid fa-file-pdf text-sm"></i>
                        </div>
                        <div class="truncate">
                            <h5 class="text-sm font-bold text-slate-800 dark:text-slate-200 truncate">${note.title}</h5>
                            <a href="${note.url}" target="_blank" class="text-[10px] text-blue-500 hover:underline truncate block">লিংক ওপেন করুন</a>
                        </div>
                    </div>
                    <button onclick="deleteSpecificNote('${note.id}')" class="w-8 h-8 rounded hover:bg-rose-100 dark:hover:bg-rose-500/20 text-slate-400 hover:text-rose-600 dark:hover:text-rose-400 flex items-center justify-center transition flex-shrink-0">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                `;
                notesListContainer.appendChild(item);
            });
        }

        function addNewNote() {
            const title = titleInput.value.trim() || 'Untitled Note';
            const url = linkInput.value.trim();
            
            if (!url) { alert('অনুগ্রহ করে লিংকটি বক্সে দিন!'); return; }
            
            if (!savedNotesData[activeChapterKey]) {
                savedNotesData[activeChapterKey] = [];
            }
            
            savedNotesData[activeChapterKey].push({
                id: Date.now().toString(),
                title: title,
                url: url
            });
            
            localStorage.setItem('nexus_notes_data_v2', JSON.stringify(savedNotesData));
            
            titleInput.value = '';
            linkInput.value = '';
            renderNotesListInModal();
            renderChaptersUI(document.getElementById('chapter-search').value); 
        }

        function deleteSpecificNote(noteId) {
            if (confirm('এই নোটটি ডিলিট করতে চাও?')) {
                let notes = savedNotesData[activeChapterKey];
                notes = notes.filter(n => n.id !== noteId);
                
                if (notes.length === 0) delete savedNotesData[activeChapterKey];
                else savedNotesData[activeChapterKey] = notes;
                
                localStorage.setItem('nexus_notes_data_v2', JSON.stringify(savedNotesData));
                renderNotesListInModal();
                renderChaptersUI(document.getElementById('chapter-search').value);
            }
        }

        function navigate(viewName) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            setTimeout(() => document.getElementById(`view-${viewName}`).classList.add('active'), 50);
            if (viewName === 'subjects') {
                document.getElementById('breadcrumb-subject').classList.add('hidden');
                document.getElementById('breadcrumb-paper').classList.add('hidden');
                currentSubject = null; currentPaper = null;
            }
        }

        function updateBreadcrumb(level) {
            const bcSub = document.getElementById('breadcrumb-subject');
            const bcPap = document.getElementById('breadcrumb-paper');
            if (level === 'papers') {
                bcSub.classList.remove('hidden'); bcPap.classList.add('hidden');
                document.getElementById('bc-subject-name').innerText = currentSubject.name;
                bcSub.onclick = () => navigate('papers');
                bcSub.classList.add('cursor-pointer');
            } 
            else if (level === 'chapters') {
                bcPap.classList.remove('hidden');
                document.getElementById('bc-paper-name').innerText = currentPaper.name;
                bcSub.classList.add('cursor-pointer');
            }
        }
    </script>
</body>
</html>
